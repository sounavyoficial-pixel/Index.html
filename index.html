<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GaIA IP — Terminal de Borda Soberana</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #ffffff;
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Farol Tátil Sóbrio - Inicia no centro embaixo */
        #gaia-bolinha {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 54px;
            height: 54px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999999;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            touch-action: none;
            user-select: none;
            transition: box-shadow 0.2s;
        }
        #gaia-bolinha::after {
            content: '';
            width: 14px;
            height: 14px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* Painel de Controle Flutuante */
        #gaia-painel {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 999998;
        }
        .painel-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .painel-btn {
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 8px 4px;
            font-size: 11px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
        }
        .painel-btn:active {
            background: #10b981;
            color: #fff;
        }
        #status-texto {
            font-size: 11px;
            color: #10b981;
            text-align: center;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="gaia-painel">
        <div id="status-texto">SDRR v3.0 // BORDA ATIVA</div>
        <div class="painel-grid">
            <button class="painel-btn" onclick="moverPara('Topo Esq')">↗ Topo Esq</button>
            <button class="painel-btn" onclick="moverPara('Norte / Menu')">↑ Menu Topo</button>
            <button class="painel-btn" onclick="moverPara('Topo Dir')">↖ Topo Dir</button>
            <button class="painel-btn" onclick="moverPara('Centro')">⊙ Centro</button>
            <button class="painel-btn" onclick="moverPara('Base Esq')">↙ Base Esq</button>
            <button class="painel-btn" onclick="moverPara('Descanso')">↘ Descanso</button>
        </div>
    </div>

    <div id="gaia-bolinha" title="Farol Tátil GaIA"></div>

    <script>
        const ball = document.getElementById('gaia-bolinha');
        const painel = document.getElementById('gaia-painel');
        const statusTexto = document.getElementById('status-texto');

        let isDragging = false;
        let startX, startY;
        let initialLeft, initialTop;

        // Abrir/Fechar painel ao clicar na bolinha (se não estiver arrastando muito)
        let moved = false;

        ball.addEventListener('pointerdown', (e) => {
            isDragging = true;
            moved = false;
            startX = e.clientX;
            startY = e.clientY;
            
            const rect = ball.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            ball.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        ball.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                moved = true;
            }

            ball.style.left = (initialLeft + dx) + 'px';
            ball.style.top = (initialTop + dy) + 'px';
            ball.style.transform = 'none'; // Remove o centralizador para dar liberdade total de arraste
            ball.style.bottom = 'auto';
            ball.style.right = 'auto';
        });

        ball.addEventListener('pointerup', (e) => {
            isDragging = false;
            ball.releasePointerCapture(e.pointerId);
            
            if (!moved) {
                // Toque simples: alterna o painel
                painel.style.display = painel.style.display === 'flex' ? 'none' : 'flex';
            }
        });

        function moverPara(local) {
            statusTexto.innerText = "Salto executado para: " + local;
            ball.style.transform = 'none';
            if(local === 'Centro') {
                ball.style.top = '50%';
                ball.style.left = '50%';
                ball.style.transform = 'translate(-50%, -50%)';
            } else if(local.includes('Topo')) {
                ball.style.top = '20px';
                ball.style.left = '50%';
                ball.style.transform = 'translateX(-50%)';
            } else {
                ball.style.bottom = '40px';
                ball.style.left = '50%';
                ball.style.transform = 'translateX(-50%)';
            }
        }
    </script>
</body>
</html>
