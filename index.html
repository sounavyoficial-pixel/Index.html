<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GaIA IP — Navegador Soberano de Borda</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Farol Tátil Sóbrio */
        #gaia-bolinha {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 54px;
            height: 54px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999999;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            touch-action: none;
            user-select: none;
        }
        #gaia-bolinha::after {
            content: '';
            width: 14px;
            height: 14px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* Painel de Navegação e Borda Soberana */
        #gaia-painel {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 999998;
            color: #f8fafc;
        }
        .painel-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .painel-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 4px;
            font-size: 11px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
        }
        .painel-btn:active {
            background: #10b981;
            color: #fff;
        }
        .info-box {
            background: #1e293b;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .online { background: #065f46; color: #34d399; }
        .offline { background: #7f1d1d; color: #f87171; }
    </style>
</head>
<body>

    <div id="gaia-painel">
        <div class="info-box">
            <div>Rede: <span id="rede-status" class="status-badge">Verificando...</span></div>
            <div>Posição: <span id="geo-status" style="color: #38bdf8;">Buscando coordenadas...</span></div>
            <div>Contexto: <span id="readme-status" style="color: #fbbf24;">Lendo Borda (README)...</span></div>
        </div>
        <div class="painel-grid">
            <button class="painel-btn" onclick="moverPara('Topo Esq')">↗ Topo Esq</button>
            <button class="painel-btn" onclick="moverPara('Norte / Menu')">↑ Menu Topo</button>
            <button class="painel-btn" onclick="moverPara('Topo Dir')">↖ Topo Dir</button>
            <button class="painel-btn" onclick="moverPara('Centro')">⊙ Centro</button>
            <button class="painel-btn" onclick="moverPara('Base Esq')">↙ Base Esq</button>
            <button class="painel-btn" onclick="moverPara('Descanso')">↘ Descanso</button>
        </div>
    </div>

    <div id="gaia-bolinha" title="Farol Tátil GaIA"></div>

    <script>
        const ball = document.getElementById('gaia-bolinha');
        const painel = document.getElementById('gaia-painel');
        const redeStatus = document.getElementById('rede-status');
        const geoStatus = document.getElementById('geo-status');
        const readmeStatus = document.getElementById('readme-status');

        let isDragging = false;
        let startX, startY;
        let initialLeft, initialTop;
        let moved = false;

        // 1. Monitorar Conexão Online / Offline
        function atualizarRede() {
            if (navigator.onLine) {
                redeStatus.innerText = "ONLINE (Nuvem Ativa)";
                redeStatus.className = "status-badge online";
            } else {
                redeStatus.innerText = "OFFLINE (Modo Borda Local)";
                redeStatus.className = "status-badge offline";
            }
        }
        window.addEventListener('online', atualizarRede);
        window.addEventListener('offline', atualizarRede);
        atualizarRede();

        // 2. Leitura de Geolocalização Real
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(4);
                    const lon = position.coords.longitude.toFixed(4);
                    geoStatus.innerText = `Lat: ${lat}, Lon: ${lon}`;
                    readmeStatus.innerText = "README: Borda Sincronizada com Sucesso.";
                },
                (error) => {
                    geoStatus.innerText = "GPS Indisponível / Negado";
                    readmeStatus.innerText = "README: Modo Autônomo Offline Ativo.";
                },
                { timeout: 10000 }
            );
        } else {
            geoStatus.innerText = "Geolocalização não suportada";
        }

        // 3. Mecânica de Arraste Fluida
        ball.addEventListener('pointerdown', (e) => {
            isDragging = true;
            moved = false;
            startX = e.clientX;
            startY = e.clientY;
            
            const rect = ball.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            ball.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        ball.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                moved = true;
            }

            ball.style.left = (initialLeft + dx) + 'px';
            ball.style.top = (initialTop + dy) + 'px';
            ball.style.transform = 'none';
            ball.style.bottom = 'auto';
            ball.style.right = 'auto';
        });

        ball.addEventListener('pointerup', (e) => {
            isDragging = false;
            ball.releasePointerCapture(e.pointerId);
            
            if (!moved) {
                painel.style.display = painel.style.display === 'flex' ? 'none' : 'flex';
            }
        });

        function moverPara(local) {
            ball.style.transform = 'none';
            if(local === 'Centro') {
                ball.style.top = '50%';
                ball.style.left = '50%';
                ball.style.transform = 'translate(-50%, -50%)';
            } else if(local.includes('Topo')) {
                ball.style.top = '20px';
                ball.style.left = '50%';
                ball.style.transform = 'translateX(-50%)';
            } else {
                ball.style.bottom = '40px';
                ball.style.left = '50%';
                ball.style.transform = 'translateX(-50%)';
            }
        }
    </script>
</body>
</html>
