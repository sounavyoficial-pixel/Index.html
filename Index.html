<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GaIA IP - Borda Soberana</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            padding: 15px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-tag {
            background: #238636;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
        }
        main {
            padding: 20px;
            flex-grow: 1;
        }
        .terminal-box {
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #58a6ff;
        }
        /* A Bolinha Fixa nas Coordenadas X e Y (Sem Arrastar) */
        #gaia-bolinha {
            position: fixed;
            bottom: 25px;   /* Coordenada Y */
            right: 25px;   /* Coordenada X */
            width: 22px;
            height: 22px;
            background: #2ea043;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(46, 160, 67, 0.6);
            cursor: pointer;
            z-index: 999999;
        }
    </style>
</head>
<body>

    <header>
        <span>SOUNAVY // GAIA-IP</span>
        <span class="status-tag">BORDA ATIVA</span>
    </header>

    <main>
        <h2>Soberania de Borda</h2>
        <p>Interface leve. A Bolinha está fixa no canto (X, Y) operando sem atrito.</p>
        <div class="terminal-box" id="log-panel">
            [SYS]: Posição X/Y fixada. Zero consumo de recursos.<br>
            [STATUS]: Pronto para o comando do Arquiteto.
        </div>
    </main>

    <div id="gaia-bolinha" title="Farol Tátil GaIA"></div>

    <script>
        document.getElementById('gaia-bolinha').addEventListener('click', () => {
            const timestamp = new Date().toLocaleTimeString();
            const panel = document.getElementById('log-panel');
            panel.innerHTML += `<br>[${timestamp} - SEMENTE]: Intenção validada na borda.`;
        });
    </script>
</body>
</html>
