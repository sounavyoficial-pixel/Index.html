<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GaIA IP — Terminal de Borda Soberana</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .terminal-box {
            max-width: 650px;
            width: 100%;
            margin: auto;
            background: #161b22;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { font-size: 16px; color: #38bdf8; margin-bottom: 12px; font-family: monospace; }
        p { font-size: 13px; line-height: 1.5; color: #8b949e; margin-bottom: 12px; }
        .status-tag {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid #38bdf8;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            margin-bottom: 16px;
        }
        .meta-tag {
            font-family: monospace;
            font-size: 10px;
            color: #484f58;
            border-top: 1px solid #21262d;
            padding-top: 12px;
            margin-top: 12px;
            word-break: break-all;
        }

        /* Farol Tátil Sóbrio (Bolinha Azul Arrastável) */
        #gaia-bolinha {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            background: rgba(56, 189, 248, 0.15);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999999;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
            touch-action: none;
            user-select: none;
        }
        #gaia-bolinha::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: #38bdf8;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        <span class="status-tag">SDRR v3.0 // BORDA ATIVA</span>
        <h1>GAIA IP — ENCLAVE SOBERANO</h1>
        <p>Interface de navegação e direcionamento tátil. Módulo de borda pronto para operação limpa e sem ruídos visuais.</p>
        <div class="meta-tag">
            AUTOR: ANTÔNIO ALBERTO L. ELIAS<br>
            HASH: 594a8b95fbd50fc9e4a90d8a3cb54feb49f0b6a8
        </div>
    </div>

    <div id="gaia-bolinha" title="Farol Tátil GaIA"></div>

    <script>
        const ball = document.getElementById('gaia-bolinha');
        let isDragging = false;
        let currentX, currentY, initialX, initialY;
        let xOffset = 0, yOffset = 0;

        ball.addEventListener('touchstart', dragStart, false);
        ball.addEventListener('touchend', dragEnd, false);
        ball.addEventListener('touchmove', drag, false);

        function dragStart(e) {
            initialX = e.touches[0].clientX - xOffset;
            initialY = e.touches[0].clientY - yOffset;
            if (e.target === ball) isDragging = true;
        }

        function dragEnd() {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                currentX = e.touches[0].clientX - initialX;
                currentY = e.touches[0].clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                setTranslate(currentX, currentY, ball);
            }
        }

        function setTranslate(xPos, yPos, el) {
            el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
        }

        ball.addEventListener('click', () => {
            alert('GaIA IP: Farol Tátil acionado na Borda.');
        });
    </script>
</body>
</html>
